# Rule sync metadata for adapters.
# Source files under rules/ are pure Markdown (no frontmatter).
# Adapters read this manifest to generate tool-specific formats.

rules:
  - source: core/communication.md
    description: 统一中文回复和标点偏好
    alwaysApply: true

  - source: core/writing-style.md
    description: 编写注释, 文档和 commit message 时遵循书写规范
    globs: "**/*"

  - source: core/coding-principles.md
    description: 修改代码时遵循最小改动, 边界和验证原则
    globs: "**/*"

  - source: core/honor-and-dishonor.md
    description: AI 行为准则
    alwaysApply: true

  - source: core/rule-conflict-resolution.md
    description: 发现 RULES, AGENTS.md 或 CONTEXT.md 冲突时暂停并请求决策
    alwaysApply: true

  - source: core/twelve-factor-app.md
    description: 设计服务配置, 部署和运行时行为时使用 12-Factor 原则
    alwaysApply: true

  - source: core/testing-scope.md
    description: 根据变更影响选择最小必要测试范围
    alwaysApply: true

  - source: docs/diagrams.md
    description: 编写 Markdown 流程, 时序或状态图时使用 Mermaid
    globs: "**/*.md"

  - source: docs/directory-tree.md
    description: 在 Markdown 中展示目录结构时遵循 tree 格式
    globs: "**/*.md"

  - source: docs/document-format.md
    description: 编写项目说明文档时遵循 SKILL 格式
    globs: "**/*.md"

  - source: workflows/git-workflow.md
    description: 创建分支, 提交或推送代码时遵循 Git 工作流
    globs: "**/*"

  - source: workflows/documentation-sync.md
    description: 变更代码或计划完成时检查文档同步
    globs: "**/*"

  - source: workflows/domain-modeling.md
    description: 进入项目或遇到领域术语时遵循 CONTEXT.md
    globs: "**/*"

  - source: languages/rust.md
    description: 修改 Rust 代码时遵循 Clippy 零 warning 约束
    globs: "**/*.rs"

  - source: languages/python.md
    description: 修改 Python 项目时使用 uv 管理依赖和环境
    globs: "**/*.py"

  - source: core/superpowers.md
    description: 执行 plan, 测试 seam 和用户确认流程时使用
    alwaysApply: true
