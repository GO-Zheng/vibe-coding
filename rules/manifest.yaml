# Rule sync metadata for adapters.
# Source files under rules/ are pure Markdown (no frontmatter).
# Adapters read this manifest to generate tool-specific formats.

rules:
  - source: core/communication.md
    description: 沟通与回复语言
    alwaysApply: true

  - source: workflows/routing.md
    description: 工作流路由 (按任务类型选择大改/小改入口)
    alwaysApply: true

  - source: core/writing-style.md
    description: 书写风格 (中文、标点、标识符、标题、commit)
    globs: "**/*"

  - source: core/coding-principles.md
    description: 代码原则 (最小改动、SOLID、规模限制、如实说明)
    globs: "**/*"

  - source: docs/diagrams.md
    description: 文档图示 (Mermaid 流程图/时序图/状态图)
    globs: "**/*.md"

  - source: docs/directory-tree.md
    description: 文档目录结构 (tree 风格)
    globs: "**/*.md"

  - source: docs/document-format.md
    description: 文档格式规范 (使用 SKILL 格式)
    globs: "**/*.md"

  - source: workflows/git-workflow.md
    description: Git 工作流 (分支、提交、合并、安全)
    globs: "**/*"

  - source: workflows/documentation-sync.md
    description: 文档同步 (提交/plan 完成后检查文档一致性)
    globs: "**/*"

  - source: workflows/domain-modeling.md
    description: 领域建模 (CONTEXT.md 术语定义, 进入项目先读)
    globs: "**/*"

  - source: languages/rust.md
    description: Rust 规范 (clippy warning 必须处理)
    globs: "**/*.rs"

  - source: languages/python.md
    description: Python 规范 (统一使用 uv 管理包)
    globs: "**/*.py"

  - source: core/superpowers.md
    description: Superpowers 补充 (plan/spec 统一存放路径)
    alwaysApply: true
